[package]
name = "chrono-ci-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-ci = { path = "../ci" }
verus_builtin_macros = "=0.0.0-2026-04-20-1748"

[[test]]
name = "verified_download"
path = "tests/verified_download.rs"

[[test]]
name = "installed_runner"
path = "tests/installed_runner.rs"

[dev-dependencies]
serde_json = "1"
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
sha2 = "0.11"
tempfile = "3"

[[test]]
name = "native_cache_action"
path = "tests/native_cache_action.rs"

[[example]]
name = "release_observation"
path = "tests/verified_download.rs"

[[test]]
name = "deployed_host"
path = "../../.chrono-harness/ci/host_adapters.rs"

[[test]]
name = "actions_lock"
path = "tests/actions_lock.rs"
