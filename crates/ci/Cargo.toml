[package]
name = "chrono-ci"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-ci"
path = "src/main.rs"
test = false
bench = false

[dependencies]
serde_yaml_ng = "=0.10.0"
litrs = "=1.0.1"
vstd = "=0.0.0-2026-04-20-1748"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
rustix = { version = "1", features = ["net", "fs"] }
sha2 = "0.10"
verus_builtin_macros = "=0.0.0-2026-04-20-1748"

[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
